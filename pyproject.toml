[project]
name = "healthcare-knowledge-navigator"
version = "0.1.0"
description = "RAG service answering clinical questions with citations"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

# FastAPI dependency markers are called in argument defaults by design (B008).
# Must match the reference repo: app/main.py is a shared engine file, so a ruff config
# that differs per repo makes identical code lint differently in each one.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
# 3.12, matching what actually runs: CI uses 3.12, both Dockerfiles install python3.12.
# Under 3.11 mypy rejects its own dependency stubs — numpy >=2.5 writes PEP 695 `type`
# aliases, giving "Type statement is only supported in Python 3.12 and greater" before
# a single line of app/ is checked.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
